# Round 3 baseline arm: de novo 28-32 aa peptide design.
# Binding labels apply ONLY to receptor R. No pilot sequence or ligand scaffold is supplied.
# Label indices use canonical receptor numbering minus 28.
entities:
  - protein:
      id: B
      sequence: 28..32
      cyclic: false
  - file:
      path: reference/6X18_R_canonical.cif
      include:
        - chain:
            id: R
      binding_types:
        - chain:
            id: R
            # R190, Q234, W306, R380
            binding: 162,206,278,352
            not_binding: 102..107,311..315
      structure_groups: "all"
