# Wider length exploration for the BoltzGen peptide-anything protocol.
# Numbering and target preparation are identical to glp1r_peptide_central.yaml.
# Run only after checking the 28-32 aa smoke test and inspecting peptide direction.

entities:
  - protein:
      id: B
      sequence: 25..35
      cyclic: false

  - file:
      path: reference/6X18_R_canonical.cif
      include:
        - chain:
            id: R
      binding_types:
        - chain:
            id: R
            binding: 206,278,352
      structure_groups: "all"

