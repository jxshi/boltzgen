# Competition route: all peptide residues AND its backbone are generated anew.
# No GLP-1 motif, ligand scaffold, or pilot candidate is supplied.
# Binding labels below annotate target residues only. They are soft conditioning,
# NOT peptide-to-target distance restraints, and do not guarantee peptide direction.
entities:
  - protein:
      id: B
      sequence: 28..32
      cyclic: false
  - file:
      path: reference/6X18_R_canonical.cif
      include:
        - chain:
            id: R
      binding_types:
        - chain:
            id: R
            # canonical R190,Q234,W306,R380; label_seq_id = canonical - 28
            binding: 162,206,278,352
            # Experimentally unresolved loops, not physical blocking restraints.
            not_binding: 102..107,311..315
      structure_groups: "all"
